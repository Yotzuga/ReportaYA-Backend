spring.application.name=incidencia-urbana-flutter

# Local secret overrides (gitignored). Auto-cargado si existe. 
spring.config.import=optional:file:./application-local.properties

# Server port (port 8081 to run alongside original backend on 8080)
server.port=8081

# JWT configuration (HS256). Secret must be >= 32 bytes (256 bits).
# Configurar via JWT_SECRET env var o application-local.properties (gitignored).
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}



# PostgreSQL Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
# update crea/ajusta tablas solo (comodo en desarrollo). En produccion se puede
# fijar JPA_DDL_AUTO=validate para que Hibernate nunca altere el esquema.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# hibernate.dialect se auto-detecta desde la JDBC URL desde Hibernate 6.x.
# Especificarlo explícitamente dispara el warning HHH90000025 (removido a propósito).

# Firebase Storage bucket (cada dev configura el suyo en application-local.properties)
firebase.storage.bucket=${FIREBASE_STORAGE_BUCKET:}
# Credenciales de la service account (opcionales). En Render, lo practico es
# FIREBASE_CREDENTIALS_BASE64 con el JSON codificado en base64. Sin credenciales,
# las fotos se guardan en PostgreSQL (tabla foto_archivos) y se sirven en /media/fotos/{clave}.
firebase.credentials.base64=${FIREBASE_CREDENTIALS_BASE64:}
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:}

# Resend (correos transaccionales). Configurar RESEND_API_KEY y RESEND_FROM en application-local.properties.
# En produccion, RESEND_FROM debe usar el dominio/subdominio verificado en Resend.
# Si RESEND_API_KEY esta vacio, el enlace generado se imprime en consola (modo dev).
resend.api-key=${RESEND_API_KEY:}
resend.from=${RESEND_FROM:onboarding@resend.dev}

# URL base para construir el enlace de verificacion del correo.
# En produccion debe apuntar al dominio publico, no a localhost.
app.base-url=${APP_BASE_URL:http://localhost:8081}

# CORS: solo afecta a la version web de la app (la app movil no usa CORS).
# Lista separada por comas de origenes permitidos; admite comodines de puerto.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# Detras de un proxy (Render) usa X-Forwarded-Proto/Host para armar URLs https correctas.
server.forward-headers-strategy=framework

# Logging
# Logging: el SQL y sus parametros (datos personales) no se imprimen por defecto.
# Para depurar: LOG_SQL=DEBUG y LOG_SQL_PARAMS=TRACE.
logging.level.org.hibernate.SQL=${LOG_SQL:WARN}
logging.level.org.hibernate.orm.jdbc.bind=${LOG_SQL_PARAMS:WARN}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${LOG_SQL_PARAMS:WARN}

# Serialización de fechas
spring.jackson.serialization.write-dates-as-timestamps=false

